appId: com.harness.desktop
productName: Forge Harness Desktop
copyright: Copyright © 2026 Forge Harness Team
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
compression: maximum
icon: icon.png
detectUpdateChannel: true
generateUpdatesFilesForAllChannels: true
afterSign: scripts/notarize.mjs

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: resources/voice/${os}/${arch}
    to: voice
    filter:
      - "**/*"
  - from: resources/runtime
    to: runtime
    filter:
      - "**/*"
  - from: dist/renderer
    to: renderer
    filter:
      - "**/*"

extraMetadata:
  main: dist/main.js

publish:
  provider: github
  owner: luohao0308
  repo: forge-harness
  vPrefixedTagName: true
  releaseType: release

protocols:
  - name: Harness Agent Links
    schemes:
      - agentharness

mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: Forge Harness 使用麦克风将语音转换为消息文本。原始音频不会上传，并会在转写完成后删除。
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
    - target: zip
      arch:
        - x64

dmg:
  sign: false

win:
  publisherName: Forge Harness Team
  verifyUpdateCodeSignature: true
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Forge Harness Desktop
  deleteAppDataOnUninstall: false

linux:
  category: Development
  maintainer: Forge Harness Team <release@harness.local>
  executableName: harness-desktop
  synopsis: Forge Harness Desktop workspace
  description: Desktop shell for Forge Harness with native integrations and auto-update support.
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
